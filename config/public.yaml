baseURL: "https://blog.eddiehucrafted.com.au/"
languageCode: "en-us"
defaultContentLanguage: "en"
title: "Eddie Hu Crafted"
theme: "dream"
enableRobotsTXT: true

contentDir: "content/public"
staticDir: ["static/public"]

params:
  lightTheme: "emerald"
  darkTheme: "forest"

  author: "Eddie"
  description: "Notes on learning, building, and projects."
  avatar: "/images/avatar-eddie.jpg"
  favicon: "favicon.png"
  headerTitle: "Eddie Hu Crafted"
  motto: "Learning, building, and sharing."

  rss: true
  siteStartYear: 2026
  stickyNav: true
  showTableOfContents: true
  showSummaryCoverInPost: true
  imageZoomableInPost: true
  showPrevNextPost: true

  advanced:
    customCSS:
      - "css/dream-tidy-cards.css"

menu:
  main:
    - name: "Posts"
      url: "/posts/"
      weight: 10
    - name: "Photography"
      url: "/categories/photography/"
      weight: 20
    - name: "Woodwork"
      url: "/categories/woodwork/"
      weight: 30
