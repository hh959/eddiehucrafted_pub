baseURL: "https://blog.eddiehucrafted.com.au/"
languageCode: "en-us"
defaultContentLanguage: "en"
title: "Eddie Hu Crafted"
theme: "dream"
enableRobotsTXT: true

contentDir: "content/public"
staticDir: ["static/public"]

params:
  lightTheme: "emerald"
  darkTheme: "forest"

  author: "Eddie Hu"
  description: "Notes on learning, building, and projects."
  avatar: "/images/favicon.png"
  favicon: "favicon.png"
  headerTitle: "Eddie Hu Crafted"
  motto: "Learning, building, and sharing."

  rss: true
  siteStartYear: 2026
  stickyNav: true
  showTableOfContents: true
  showSummaryCoverInPost: true
  imageZoomableInPost: true
  showPrevNextPost: true

  reorderShares: ["whatsapp", "facebook"]

  advanced:
    customCSS:
      - "css/dream-tidy-cards.css"

  reorderNavItems: ["about-page", "posts-page", "photography-page", "woodwork-page"]
  navItems:
    about-page:
      title: "About"
      href: "/about/"
    posts-page:
      title: "Posts"
      href: "/posts/"
    photography-page:
      title: "Photography"
      href: "/categories/photography/"
    woodwork-page:
      title: "Woodwork"
      href: "/categories/woodwork/"
